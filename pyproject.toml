[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gitrx"
version = "0.10.0"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["lxml==6.1.3"]

[project.scripts]
gitrx-native = "gitrx_backend.cli:main"
gitrx-native-mcp = "gitrx_backend.mcp:main"
gitrx-selftest = "gitrx_backend.selftest:main"
gitrx-recovery = "gitrx_backend.recovery:main"

[project.optional-dependencies]
test = ["pytest==9.2.0"]

[tool.setuptools.packages.find]
include = ["gitrx*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["needs_data_root: requires the external GitRx data root (GITRX_DATA_ROOT); skipped when absent"]
