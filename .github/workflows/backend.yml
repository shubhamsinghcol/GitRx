name: Portable native backend
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  installed-wheel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare disk for conservative archive guards
        run: |
          test "${RUNNER_ENVIRONMENT:-}" = github-hosted
          df -h "$RUNNER_TEMP"
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          df -h "$RUNNER_TEMP"
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - run: python -m pip install dist/gitrx-*.whl pytest==9.2.0
      - run: cp tests/test_backend_portable.py "$RUNNER_TEMP/test_backend_portable.py"
      - name: Run installed package away from checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m pytest -c /dev/null test_backend_portable.py -q
          gitrx-selftest --output "$RUNNER_TEMP/synthetic-release"
      - name: Copy maintained native regression tests
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          cp tests/test_backend_portable.py tests/test_core_workflow.py tests/test_query_limits.py tests/test_release_cycle.py tests/test_section_diff_v2.py tests/test_web.py tests/test_native_mcp_transport.py tests/test_occurrence_pagination.py tests/test_evidence_metadata.py tests/test_phrase_history.py tests/test_evidence_history_web.py tests/test_evidence_history_clients.py tests/test_mcp_discovery.py tests/test_operational_status.py tests/test_benchmark.py tests/test_changes.py tests/test_change_clients.py tests/test_change_browser.py tests/test_mcp_cancellation.py tests/test_research_helpers.py tests/test_qualification.py "$RUNNER_TEMP/native-tests/"
      - name: Run maintained native regressions against installed wheel
        working-directory: ${{ runner.temp }}
        run: python -B -m pytest -c /dev/null native-tests -q
      - name: Run acquisition preparation regressions against installed wheel
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/tests/test_census.py" "$RUNNER_TEMP/test_census.py"
          cp "$GITHUB_WORKSPACE/tests/test_capacity.py" "$RUNNER_TEMP/test_capacity.py"
          cp "$GITHUB_WORKSPACE/tests/test_acquisition_runner.py" "$RUNNER_TEMP/test_acquisition_runner.py"
          cp "$GITHUB_WORKSPACE/tests/test_backfill.py" "$RUNNER_TEMP/test_backfill.py"
          cp "$GITHUB_WORKSPACE/tests/test_backfill_inventory.py" "$RUNNER_TEMP/test_backfill_inventory.py"
          cp "$GITHUB_WORKSPACE/tests/test_scope_admission.py" "$RUNNER_TEMP/test_scope_admission.py"
          python -B -m pytest -c /dev/null test_census.py test_capacity.py test_acquisition_runner.py test_backfill.py test_backfill_inventory.py test_scope_admission.py -q
      - name: Run recovery, controls and processing regressions
        working-directory: ${{ runner.temp }}
        run: |
          cp "$GITHUB_WORKSPACE/tests/test_backfill_control.py" "$RUNNER_TEMP/test_backfill_control.py"
          cp "$GITHUB_WORKSPACE/tests/test_backfill_guardian.py" "$RUNNER_TEMP/test_backfill_guardian.py"
          cp "$GITHUB_WORKSPACE/tests/test_backfill_processing.py" "$RUNNER_TEMP/test_backfill_processing.py"
          cp "$GITHUB_WORKSPACE/tests/test_backfill_recovery.py" "$RUNNER_TEMP/test_backfill_recovery.py"
          cp "$GITHUB_WORKSPACE/tests/test_hot_storage.py" "$RUNNER_TEMP/test_hot_storage.py"
          cp "$GITHUB_WORKSPACE/tests/test_transport_policy.py" "$RUNNER_TEMP/test_transport_policy.py"
          cp "$GITHUB_WORKSPACE/tests/test_raw_journal.py" "$RUNNER_TEMP/test_raw_journal.py"
          cp "$GITHUB_WORKSPACE/tests/test_download_buffer.py" "$RUNNER_TEMP/test_download_buffer.py"
          cp "$GITHUB_WORKSPACE/tests/test_parallel_downloads.py" "$RUNNER_TEMP/test_parallel_downloads.py"
          cp "$GITHUB_WORKSPACE/tests/test_mobile_control.py" "$RUNNER_TEMP/test_mobile_control.py"
          python -B -m pytest -c /dev/null test_backfill_control.py test_backfill_guardian.py test_backfill_processing.py test_backfill_recovery.py test_hot_storage.py test_transport_policy.py test_raw_journal.py test_download_buffer.py test_parallel_downloads.py test_mobile_control.py -q
