  <g id="text_23">
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(7.56 362.984969)">Fragment-weighted. Sealed split (published figures): 3,344 never present, 3,169 present from the first captured version, 1,203 with a</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(7.56 372.587156)">transition outside the window, of 25,315 (30.5% not locatable). Open split: 34.2% of 59,324. Not-locatable fragments say nothing about</text>
   <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #333333" transform="translate(7.56 382.189344)">parser accuracy. Locatability depends on where captured history starts and on SrLC text differing from the label.</text>
